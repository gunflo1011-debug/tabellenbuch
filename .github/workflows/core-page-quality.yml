name: Core page quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-core-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate core and changed HTML pages
        run: >-
          python scripts/check_core_pages.py
          --changed-since "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: Validate canonical sitemap
        run: python scripts/build_sitemap.py --check
